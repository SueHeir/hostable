[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/rules-api",
    "crates/host-core",
    "crates/relay",
    "crates/sdk",
    "crates/sandbox",
    "crates/pack",
    "crates/tabletop",
    "crates/host-runtime",
    "crates/cloud",
    "crates/desktop",
    "crates/e2e",
    "games/buzzer",
    "games/tideholm",
    "games/riposte",
    "games/wizards-duel",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/hostable"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "process", "io-util", "fs", "signal"] }
futures-util = "0.3"
tokio-tungstenite = "0.30"
ts-rs = { version = "12", features = ["no-serde-warnings"] }
hostable-protocol = { path = "crates/protocol" }
hostable-rules-api = { path = "crates/rules-api" }
hostable-host-core = { path = "crates/host-core" }
hostable-sdk = { path = "crates/sdk" }
hostable-sandbox = { path = "crates/sandbox" }
hostable-pack = { path = "crates/pack" }
hostable-tabletop = { path = "crates/tabletop" }
hostable-host-runtime = { path = "crates/host-runtime" }
hostable-relay = { path = "crates/relay" }
hostable-buzzer = { path = "games/buzzer" }

# The sandbox interpreter is far too slow unoptimised for fuel budgets to mean
# anything in tests.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3

# Small rules.wasm files.
[profile.release]
codegen-units = 1
lto = "thin"
