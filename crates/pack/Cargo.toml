[package]
name = "hostable-pack"
description = "Build, sign and check Hostable game packs (.gamepack)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hostable-pack"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
hostable-protocol.workspace = true
hostable-rules-api.workspace = true
hostable-host-core.workspace = true
hostable-sandbox.workspace = true
hostable-tabletop.workspace = true
zip = { version = "9", default-features = false, features = ["deflate"] }
ed25519-dalek = "3"
sha2 = "0.11"
base64 = "0.23"
rand.workspace = true
wat = "1"
