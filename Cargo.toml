[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/rules-api",
    "crates/host-core",
    "crates/relay",
    "games/buzzer",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/SueHeir/hostable"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hostable-protocol = { path = "crates/protocol" }
hostable-rules-api = { path = "crates/rules-api" }
hostable-host-core = { path = "crates/host-core" }
